name: Build XrayLiteClient APK

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release with APK"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT PROJECT
      # ============================================================
      - name: Checkout project
        uses: actions/checkout@v4

      # ============================================================
      # CHECKOUT ANDROIDLIBXRAYLITE
      # ============================================================
      - name: Checkout AndroidLibXrayLite
        uses: actions/checkout@v4
        with:
          repository: 2dust/AndroidLibXrayLite
          path: AndroidLibXrayLite

      # ============================================================
      # GO
      # ============================================================
      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: AndroidLibXrayLite/go.mod

      # ============================================================
      # GOMOBILE
      # ============================================================
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      # ============================================================
      # ANDROID NDK
      # ============================================================
      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;27.0.12077973"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # ============================================================
      # BUILD LIBV2RAY.AAR
      # ============================================================
      - name: Build libv2ray.aar
        working-directory: AndroidLibXrayLite
        run: |
          mkdir -p assets data

          bash gen_assets.sh download

          cp -v data/*.dat assets/

          gomobile init

          go mod tidy

          gomobile bind \
            -v \
            -androidapi 24 \
            -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            ./

      # ============================================================
      # COPY AAR
      # ============================================================
      - name: Copy libv2ray.aar
        run: |
          mkdir -p app/libs
          cp -v AndroidLibXrayLite/libv2ray.aar app/libs/libv2ray.aar

      # ============================================================
      # UPLOAD AAR
      # ============================================================
      - name: Upload libv2ray artifact
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-aar
          path: app/libs/libv2ray.aar
          if-no-files-found: error

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ============================================================
      # BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon

      # ============================================================
      # LOCATE APK
      # ============================================================
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          APK="${{ steps.apk.outputs.path }}"

          echo "Memeriksa APK..."
          ls -lh "$APK"

          echo "Memeriksa ZIP/APK container..."
          unzip -t "$APK"

          echo "Memeriksa APK signature..."
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"

          echo "APK verification successful."

      # ============================================================
      # RENAME APK
      # ============================================================
      - name: Prepare APK
        id: prepare
        run: |
          mkdir -p release

          cp "${{ steps.apk.outputs.path }}" \
            "release/XrayLiteClient-OGTunnel-debug.apk"

          ls -lh release/

          echo "path=release/XrayLiteClient-OGTunnel-debug.apk" >> "$GITHUB_OUTPUT"

      # ============================================================
      # ACTIONS ARTIFACT
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xraylite-debug-apk
          path: release/XrayLiteClient-OGTunnel-debug.apk
          if-no-files-found: error

      # ============================================================
      # CREATE GITHUB RELEASE
      # Hanya berjalan ketika workflow dijalankan manual
      # dan create_release = true
      # ============================================================
      - name: Create GitHub Release
        if: |
          github.event_name == 'workflow_dispatch' &&
          inputs.create_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          APK="release/XrayLiteClient-OGTunnel-debug.apk"

          echo "Creating release: $TAG"

          gh release create "$TAG" "$APK" \
            --title "XrayLiteClient OG Tunnel $TAG" \
            --notes "Debug APK generated automatically by GitHub Actions."

          echo "Release berhasil dibuat."
